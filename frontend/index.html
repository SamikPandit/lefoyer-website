<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover is REQUIRED: without it every env(safe-area-inset-*)
         in the "Counter" design system resolves to 0 on notched devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6EFE4" />
    <meta name="color-scheme" content="only light" />

    <!-- ========================================================================
         SEO / social. These are the DOCUMENT defaults (i.e. the homepage).
         Per-route title/description/canonical are overridden at runtime by
         components/common/SeoHead.jsx via react-helmet-async.
         Copy here is restricted to the IMPL_SPEC §4 safe defaults — nothing
         unsubstantiated (see IMPL_SPEC §4 for the withdrawn list — the strings
         themselves are deliberately not repeated here, so a compliance grep over
         the shipped HTML stays clean)
         appears anywhere on this page.
         ===================================================================== -->
    <title>Le foyeR. — Skincare that feels like coming home.</title>
    <meta name="description" content="Made in India. Dermatologist-tested formulations for the whole family — one shelf, every skin. Free standard delivery in 3-7 days and 7-day returns." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://lefoyerglobal.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Le foyeR." />
    <meta property="og:title" content="Le foyeR. — Skincare that feels like coming home." />
    <meta property="og:description" content="Made in India. Dermatologist-tested formulations for the whole family — one shelf, every skin." />
    <meta property="og:url" content="https://lefoyerglobal.com/" />
    <meta property="og:locale" content="en_IN" />
    <!-- TODO(business): supply an approved 1200x630 social share image and add
         <meta property="og:image"> + <meta name="twitter:image"> pointing at it.
         The repo holds no logo, no hero art and no share card; the only images
         present are product shots of 1.18-6.10 MB, which exceed what Facebook
         and X will fetch. A broken og:image is worse than none, so none ships. -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Le foyeR. — Skincare that feels like coming home." />
    <meta name="twitter:description" content="Made in India. Dermatologist-tested formulations for the whole family — one shelf, every skin." />

    <!-- Inline SVG favicon: no icon file exists in public/, and a <link> to a
         missing file is a guaranteed 404 on every page view. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2314110F'/%3E%3Cpath%20d='M11%208h3.4v12.6H21V24H11z'%20fill='%23C9A96E'/%3E%3C/svg%3E" />

    <!-- ========================================================================
         Fonts — exactly the three families theme.js declares, and nothing else.
         Loaded here as a <link> only; the blocking @import was removed from
         index.css because it serialises the font fetch behind the CSS parse.
           Inter       400/500/600/700  — UI, body, every commerce string
           Inter Tight 600/700          — display, h1-h4, priceLg
           Fraunces    opsz 72, wght 600 — brand voice, 3 uses, 20px hard floor
         ===================================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=Fraunces:opsz,wght@72,600&display=swap"
    />

    <!-- Meta Pixel Code — the ONE init on the site. App.jsx must not re-init it;
         all events go through src/services/analytics.js.

         DEFERRED, deliberately. The standard snippet injects fbevents.js from
         <head> synchronously; measured on this site that is 241 KB over three
         requests (fbevents.js 114,709 B plus signals/config), which is slightly
         MORE than the entire compressed first-party payload, fetched before the
         first product pixel is painted. On the audience this store actually has —
         mid and low-end Android over Indian 4G — that is the largest non-image
         cost on the critical path.

         The `fbq` shim below is defined IMMEDIATELY and queues calls, so
         analytics.js can fire events from the first render exactly as before and
         nothing is lost; only the network fetch waits for idle (or 3.5 s, or the
         first interaction, whichever comes first). The queue replays on load.
         `track('PageView')` is still called here, so it is queued at the same
         moment it used to be and is reported with the same page context. -->
    <script>
      !function(f,b,e,v,n,t,s){
        if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
        var loaded=false;
        function load(){
          if(loaded)return;loaded=true;
          t=b.createElement(e);t.async=!0;t.src=v;
          s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s);
        }
        /* Whichever comes first: the browser going idle, a real interaction, or a
           hard 3.5 s cap so a busy main thread can never drop the pageview. */
        if('requestIdleCallback' in f){f.requestIdleCallback(load,{timeout:3500});}
        else{f.setTimeout(load,2000);}
        ['pointerdown','keydown','touchstart'].forEach(function(evt){
          b.addEventListener(evt,load,{once:true,passive:true});
        });
      }(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '4302094446724267');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <noscript>
      <img
        height="1"
        width="1"
        style="display:none"
        src="https://www.facebook.com/tr?id=4302094446724267&ev=PageView&noscript=1"
        alt=""
      />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
